# The CI-only mirror's ONLY workflow (card t_c09d9dcb). It lives here, not under .github/workflows/, so the private
# repo never runs it; scripts/ci-public-export.sh copies it to .github/workflows/ci-public.yml in the export.
# GitHub-HOSTED runners only (ci-public-lint CPX9 refuses any self-hosted label in the export's workflows).
# Triggers (t_467cac14, lane v2): `push` of ci/<sha> (the bridge exports and exits; nothing dispatches or waits) and
# workflow_dispatch (the v1 waiting bridge, and census runs). A push-triggered run executes the workflow file OF the
# pushed export commit, so the exporter always takes this file from private main (CI_PUBLIC_WORKFLOW_FROM), never from
# the PR head. This run holds no secret, no environment and no id-token: write; its verdict is READ from our side
# (scripts/lib/ci_public_verdict.py), never posted from here.
name: ci-public
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      mode:
        description: "census (step 2: run every suite, record) | gate (run .github/ci/ci-public/hermetic.txt)"
        required: true
        default: gate
      source_sha:
        description: "the hermes-home sha this export was built from (echoed into the run name)"
        required: true
      dispatch_id:
        description: "unique bridge dispatch correlation token"
        required: true
# push: `ci-public gate ci/<sha> push` (the receipts and the verdict reader read the sha from the branch)
run-name: "${{ github.event_name == 'push' && format('ci-public gate {0} push', github.ref_name) || format('ci-public {0} {1} {2}', inputs.mode, inputs.source_sha, inputs.dispatch_id) }}"
permissions:
  contents: read
concurrency:
  group: ci-public-${{ github.event_name == 'push' && github.ref_name || inputs.source_sha }}-${{ inputs.mode || 'gate' }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.9
            3.11
            3.12
      - name: interpreter dirs ($PY39/$PY311/$PY312 as the self-hosted pool exports them)
        run: |
          for v in 3.9 3.11 3.12; do
            d=$(dirname "$(command -v python$v)")
            echo "PY${v/./}=$d" >> "$GITHUB_ENV"
          done
      - name: suites
        run: |
          python3.12 .github/ci/ci-public/run_suites.py --mode "${{ inputs.mode || 'gate' }}" \
            --shard ${{ matrix.shard }} --shards 1 --out "ci-public-${{ matrix.shard }}.jsonl"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          # the attempt in the name: a re-run's receipts read only that attempt's results (ci_public_receipts)
          name: ci-public-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: ci-public-${{ matrix.shard }}.jsonl
          retention-days: 14
